name: release
on:
  release:
    types: [published]

jobs:
  build:
    name: build the package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs reads the version from the tag.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
      - name: Build sdist and wheel
        run: uv build
      - name: Check the version is the tag's
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ls dist
          test -f "dist/fcling-${VERSION}-py3-none-any.whl"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts this workflow in this environment, no token.
    environment:
      name: pypi
      url: https://pypi.org/project/fcling/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    name: push the container image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/fcling
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # A cache write that loses a race with another run must not fail the build.
          cache-to: type=gha,mode=max,ignore-error=true
